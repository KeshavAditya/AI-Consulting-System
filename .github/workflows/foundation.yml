name: Agency review checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate and report (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-23
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-10-23
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify synthetic records and expected calculations
        run: python scripts/validate_examples.py
      - name: Check calculations, evidence, and CLI behavior
        run: python -m unittest discover -s tests -v
      - name: Generate demonstration report
        run: python -m agency_review examples/synthetic_agency --output outputs/ci-review
